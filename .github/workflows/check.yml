name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MOONSHOT_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/dsh/package-lock.json
      - run: npm ci
      - run: npm ci --prefix runtime/dsh --ignore-scripts
      - name: Download public embedding model
        run: npm run memory:setup
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
